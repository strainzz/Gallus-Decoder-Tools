[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gallus-decoder-tools"
version = "0.1.0"
description = "Local Gallus calculators for gematria, number properties, and date span."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Gallus Labs" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["python-dateutil>=2.8"]

[project.scripts]
gallus-decoder-tools = "gallus_decoder_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
